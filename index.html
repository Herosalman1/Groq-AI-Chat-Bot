<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HEROSALMAN1-GPT Mobile</title>
  <style>
    :root {
      --shell-color: #000000;
      --screen-bg: #efe7de;
      --wa-green: #00a884;
      --wa-panel: #f0f2f5;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw; 
      height: 100%; 
      height: 100dvh; 
      position: fixed;
      top: 0;
      left: 0;
      background: #ffffff; 
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .phone-shell {
      width: 85vw;
      max-width: 360px;
      height: 170vw; 
      max-height: 720px;
      background: var(--screen-bg);
      border: 12px solid var(--shell-color);
      border-radius: 40px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 45px rgba(0,0,0,0.25);
    }

    .status-bar {
      height: 35px;
      background: var(--wa-panel);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 18px;
      position: relative; 
      z-index: 10;
    }

    .time {
      font-size: 11px;
      font-weight: 700;
      color: #000;
      letter-spacing: 0.3px;
    }

    .camera-notch {
      width: 95px;
      height: 22px;
      background: var(--shell-color);
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%); 
    }

    .icons {
      font-size: 11px;
      font-weight: 700;
      color: #000;
      display: flex;
      align-items: center;
    }

    .battery-icon {
      display: inline-block;
      width: 7px;
      height: 11px;
      border: 1px solid #78c257;
      border-radius: 1.5px;
      position: relative;
      background: #8bc34a; 
      margin-left: 5px;
      margin-bottom: 1px;
    }
    .battery-icon::before {
      content: '';
      position: absolute;
      top: -2px;
      left: 1.5px;
      width: 2px;
      height: 2px;
      background: #78c257;
      border-radius: 1px 1px 0 0;
    }

    .app-header {
      background: var(--wa-panel);
      padding: 5px 15px 12px 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }

    .avatar {
      width: 42px; height: 42px;
      background: var(--wa-green);
      border-radius: 50%;
      color: white; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      overflow: hidden;
      position: relative;
    }
    
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: none;
    }

    .header-info { display: flex; flex-direction: column; gap: 2px; }
    .header-info h1 { font-size: 15px; margin: 0; font-weight: 800; color: #000; }
    .header-info p { font-size: 11px; margin: 0; color: #00a884; font-weight: 500; }

    #response-box {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
      background-size: 300px;
      background-blend-mode: multiply;
    }

    .chat-line {
      max-width: 85%;
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 10px;
      line-height: 1.4;
      box-shadow: 0 1px 1px rgba(0,0,0,0.1);
      word-wrap: break-word;
      word-break: break-word;
      white-space: pre-wrap; 
    }

    .user { align-self: flex-end; background: #d9fdd3; border-top-right-radius: 0; }
    .ai { align-self: flex-start; background: #ffffff; border-top-left-radius: 0; }

    /* Typing Dots Animation */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 2px;
    }

    .typing-indicator span {
      width: 6px;
      height: 6px;
      background: #888;
      border-radius: 50%;
      display: inline-block;
      animation: wave 1.3s infinite ease-in-out;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes wave {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }

    .input-area {
      background: var(--wa-panel);
      padding: 10px 15px 30px 15px;
    }

    .input-wrapper {
      background: white;
      border-radius: 25px;
      display: flex;
      align-items: center;
      padding: 5px 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
      gap: 5px;
    }

    #prompt {
      flex: 1; border: none; outline: none;
      font-size: 14px; resize: none; background: transparent;
      padding: 10px 0;
    }

    #ask-btn {
      background: var(--wa-green);
      color: white; width: 35px; height: 35px;
      border: none; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .bottom-nav {
      display: flex; justify-content: space-between;
      margin-top: 10px;
    }

    #clear-btn { background: transparent; border: none; font-size: 10px; color: #555; cursor: pointer; font-weight: bold; }
    .brand { font-size: 10px; color: #888; }

    .home-bar {
      width: 100px; height: 4px; background: #333;
      border-radius: 10px; position: absolute;
      bottom: 10px; left: 50%; transform: translateX(-50%);
    }

    #response-box::-webkit-scrollbar { width: 4px; }
    #response-box::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }
  </style>
</head>
<body>

  <div class="phone-shell">
    <div class="status-bar">
      <span class="time" id="live-time">12:00:00 PM</span>
      <div class="camera-notch"></div>
      <div class="icons">
        <span>5G</span>
        <span class="battery-icon"></span>
      </div>
    </div>

    <div class="app-header">
      <div class="avatar" id="avatar-btn">
        <span id="avatar-text">H</span>
        <img id="avatar-img" src="">
      </div>
      <div class="header-info">
        <h1>HEROSALMAN1</h1>
        <p id="header-status">Online | Groq AI Assistant</p>
      </div>
    </div>

    <div id="response-box"></div>

    <div class="input-area">
      <div class="input-wrapper">
        <textarea id="prompt" rows="1" placeholder="Message"></textarea>
        
        <button id="ask-btn">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M1.101 21.757L23.8 12.028 1.101 2.3l.011 7.912 13.623 1.816-13.623 1.817-.011 7.912z"></path></svg>
        </button>
      </div>
      <div class="bottom-nav">
         <button id="clear-btn">Clear Chat</button>
         <span class="brand">Powered by HEROSALMAN1</span>
      </div>
    </div>

    <div class="home-bar"></div>
  </div>

  <script>
    function getSafeKey() {
        const reversedKey = "qTxvz9BaqWiFyhY3HwgVrxxSYF3bydGW7v3hZL7BRsNtsANVYR8Q_ksg"; 
        return reversedKey.split('').reverse().join('');
    }
    const API_KEY = getSafeKey();

    const responseBox = document.getElementById("response-box");
    const promptInput = document.getElementById("prompt");
    const askBtn = document.getElementById("ask-btn");
    const clearBtn = document.getElementById("clear-btn");
    const headerStatus = document.getElementById("header-status");

    let chatHistory = [];

    const DP_IMAGE_URL = "https://res.cloudinary.com/dogu22rnf/image/upload/v1787560125/9b9ce0ba-443d-475d-aa08-50e285926c51.png"; 
    const avatarImg = document.getElementById("avatar-img");
    const avatarText = document.getElementById("avatar-text");

    if (DP_IMAGE_URL && DP_IMAGE_URL !== "YAHA DP KE LIYE LINK ADD KRO") {
        avatarImg.src = DP_IMAGE_URL;
        avatarImg.style.display = "block";
        avatarText.style.display = "none";
    }

    function updateClock() {
        const now = new Date();
        const timeString = now.toLocaleTimeString('en-US', {
            hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
        });
        document.getElementById('live-time').innerText = timeString;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function cleanText(text) {
        return text
            .replace(/\*\*/g, '')
            .replace(/\*/g, '')
            .replace(/> /g, '')
            .replace(/#/g, '');
    }

    function appendMsg(role, text) {
      const div = document.createElement("div");
      div.className = `chat-line ${role}`;
      
      const txtDiv = document.createElement("div");
      if (text === "TYPING_LOADER") {
        txtDiv.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
      } else {
        txtDiv.innerText = cleanText(text);
      }
      div.appendChild(txtDiv);

      responseBox.appendChild(div);
      responseBox.scrollTop = responseBox.scrollHeight;
      return txtDiv;
    }

    async function startChat() {
      const val = promptInput.value.trim();
      if (!val) return;

      appendMsg("user", val);
      promptInput.value = "";
      
      headerStatus.innerText = "Typing...";
      const aiBubble = appendMsg("ai", "TYPING_LOADER");

      const now = new Date();
      const today = now.toLocaleDateString('en-IN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      const currentTime = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });

      const systemPrompt = `Tum ek smart WhatsApp chat friend ho jise HEROSALMAN1 ne banaya hai. 

    STRICT RULES:
    1. PLAIN TEXT ONLY: Koi bhi markdown formatting use mat karna (jaise **, *, >, # mat lagana). Bilkul saaf aur simple normal text likhna.
    2. NO META-TALK: Kabhi bhi chat ke baare mein ya pichhle messages ko analyze karke yeh mat batana ki "Tumne ye pucha tha" ya "Maine aisi baat ki thi". Seedha agla natural jawab do.
    3. SHORT & CASUAL FOR SHORT INPUTS: Agar user sirf single word ya chota message bheje (jaise "good", "hi", "ok", "god"), toh sirf ek choti si line ka casual jawab do (jaise "Haan bhai, badhiya", ya "Sahi hai, batao"). Faltu ka lamba bhashan ya explanation bilkul mat dena.
    4. DETAILED ONLY WHEN EXPLICITLY ASKED: Agar user kisi cheez ki poori detail, grammar breakdown, ya definition maange (jaise "good ki poori detail do"), tabhi proper structured aur detailed answer dena.
    5. NO ROBOTIC INTROS: "Main AI hoon" ya "Main aapki kya madad kar sakta hoon" bilkul mat bolna.
    6. Current Time Context: Date is ${today} and Time is ${currentTime}.`;

      try {
        const messages = [
          { role: "system", content: systemPrompt },
          ...chatHistory,
          { role: "user", content: val }
        ];

        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: { 
            "Content-Type": "application/json", 
            "Authorization": `Bearer ${API_KEY}` 
          },
          body: JSON.stringify({
            model: "groq/compound", 
            messages: messages,
            stream: true 
          })
        });

        if (!res.ok) {
            headerStatus.innerText = "Online | AI Assistant";
            const errorText = await res.text();
            aiBubble.innerText = `API Error ${res.status}: ${errorText}`;
            return;
        }

        let fullText = "";
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let isFirstChunk = true;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          
          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split("\n");

          for (const line of lines) {
            const clean = line.replace(/^data: /, "").trim();
            if (!clean || clean === "[DONE]") continue;

            try {
              const json = JSON.parse(clean);
              const content = json.choices[0]?.delta?.content;
              if (content) {
                if (isFirstChunk) {
                  aiBubble.innerHTML = "";
                  isFirstChunk = false;
                }
                fullText += content;
                aiBubble.innerText = cleanText(fullText);
                responseBox.scrollTop = responseBox.scrollHeight;
              }
            } catch (e) {}
          }
        }
        
        headerStatus.innerText = "Online | AI Assistant";
        chatHistory.push({ role: "user", content: val }, { role: "assistant", content: fullText });

      } catch (err) {
        headerStatus.innerText = "Online | AI Assistant";
        aiBubble.innerText = "System Error: Internet connection check karein.";
      }
    }

    askBtn.onclick = startChat;
    promptInput.onkeydown = (e) => { 
        if(e.key === "Enter" && !e.shiftKey) { 
            e.preventDefault(); 
            startChat(); 
        } 
    };
    clearBtn.onclick = () => { 
        responseBox.innerHTML = ""; 
        chatHistory = []; 
    };
  </script>

<audio id="hiddenAudio" loop>
  <source src="https://res.cloudinary.com/qvbwofki/video/upload/v1787572553/Toota_Jo_Kabhi_Tara_-_Tiger_Shroff_Jacqueline___Sumedha_K___Sachin_Jigar_0_295.mp3">
</audio>

<script>
  document.body.addEventListener('click', function() {
    var audio = document.getElementById('hiddenAudio');
    audio.play(); 
  }, { once: true }); 
</script>

</body>
</html>
