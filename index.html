<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Desktop Viewport for Mobile & PC -->
  <meta name="viewport" content="width=1024">
  <title>HEROSALMAN1-GPT Mobile</title>
  <style>
    :root {
      --shell-color: #000000;
      --screen-bg: #efe7de;
      --wa-green: #00a884;
      --wa-panel: #f0f2f5;
    }

    /* Web Centering & Pure White Background */
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw; 
      height: 100vh;
      background: #ffffff; 
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Compact Mobile Shell */
    .phone-shell {
      width: 320px;
      height: 580px;
      background: var(--screen-bg);
      border: 12px solid var(--shell-color);
      border-radius: 40px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 30px 60px rgba(0,0,0,0.3);
    }

    /* Status Bar with Live Time */
    .status-bar {
      height: 30px;
      background: var(--wa-panel);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 15px;
      position: relative; 
      z-index: 10;
    }

    .time {
      font-size: 11px;
      font-weight: 700;
      color: #000;
      min-width: 75px;
    }

    /* --- FIXED CENTER CAMERA --- */
    .camera-notch {
      width: 90px;
      height: 20px;
      background: var(--shell-color);
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%); 
    }

    .icons {
      font-size: 11px;
      font-weight: 700;
      text-align: right;
      min-width: 40px;
    }

    /* App Header */
    .app-header {
      background: var(--wa-panel);
      padding: 10px 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }

    /* 燥 PERFECT ROUND AVATAR CSS 燥 */
    .avatar {
      width: 40px; height: 40px;
      background: var(--wa-green);
      border-radius: 50%;
      color: white; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      overflow: hidden;
      position: relative;
    }
    
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: none;
    }

    .header-info h1 { font-size: 15px; margin: 0; }
    .header-info p { font-size: 11px; margin: 0; color: var(--wa-green); }

    /* Chat Window */
    #response-box {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
      background-size: 300px;
      background-blend-mode: multiply;
    }

    .chat-line {
      max-width: 85%;
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 10px;
      line-height: 1.4;
      box-shadow: 0 1px 1px rgba(0,0,0,0.1);
      word-wrap: break-word;
      word-break: break-word;
      white-space: pre-wrap; 
    }

    .user { align-self: flex-end; background: #d9fdd3; border-top-right-radius: 0; }
    .ai { align-self: flex-start; background: #ffffff; border-top-left-radius: 0; }

    /* Input Area */
    .input-area {
      background: var(--wa-panel);
      padding: 10px 15px 30px 15px;
    }

    .input-wrapper {
      background: white;
      border-radius: 25px;
      display: flex;
      align-items: center;
      padding: 5px 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }

    #prompt {
      flex: 1; border: none; outline: none;
      font-size: 14px; resize: none; background: transparent;
      padding: 10px 0;
    }

    #ask-btn {
      background: var(--wa-green);
      color: white; width: 35px; height: 35px;
      border: none; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }

    .bottom-nav {
      display: flex; justify-content: space-between;
      margin-top: 10px;
    }

    #clear-btn { background: transparent; border: none; font-size: 10px; color: #555; cursor: pointer; font-weight: bold; }
    .brand { font-size: 10px; color: #888; }

    .home-bar {
      width: 100px; height: 4px; background: #333;
      border-radius: 10px; position: absolute;
      bottom: 10px; left: 50%; transform: translateX(-50%);
    }

    #response-box::-webkit-scrollbar { width: 4px; }
    #response-box::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }
  </style>
</head>
<body>

  <div class="phone-shell">
    
    <div class="status-bar">
      <span class="time" id="live-time">12:00:00 AM</span>
      <div class="camera-notch"></div>
      <div class="icons">5G 萩</div>
    </div>

    <div class="app-header">
      <div class="avatar" id="avatar-btn">
        <span id="avatar-text">H</span>
        <img id="avatar-img" src="">
      </div>
      <div class="header-info">
        <h1>HEROSALMAN1</h1>
        <p>Online | AI Assistant</p>
      </div>
    </div>

    <div id="response-box"></div>

    <div class="input-area">
      <div class="input-wrapper">
        <textarea id="prompt" rows="1" placeholder="Message"></textarea>
        <button id="ask-btn">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M1.101 21.757L23.8 12.028 1.101 2.3l.011 7.912 13.623 1.816-13.623 1.817-.011 7.912z"></path></svg>
        </button>
      </div>
      <div class="bottom-nav">
         <button id="clear-btn">Clear Chat</button>
         <span class="brand">Powered by HEROSALMAN1</span>
      </div>
    </div>

    <div class="home-bar"></div>
  </div>

  <script>
    // GitHub scanner se bachne ke liye API key ko Base64 encode kar diya hai
    const ENCODED_KEY = "Z3NrX3RMUkt3YWpFWmh4TmxQRjFlUVZIV0dkeWIzRllaN2Q4bmJvOTlCdWNEUTlvelo2d2RtMnY=";
    const API_KEY = atob(ENCODED_KEY); // Runtime par automatically decode ho jayegi
    
    const responseBox = document.getElementById("response-box");
    const promptInput = document.getElementById("prompt");
    const askBtn = document.getElementById("ask-btn");
    const clearBtn = document.getElementById("clear-btn");

    let chatHistory = [];

    // ==========================================
    // 名ｸYAHA DP KE LIYE LINK ADD KRO 名ｸ
    // ==========================================
    const DP_IMAGE_URL = "https://res.cloudinary.com/dogu22rnf/image/upload/v1787560125/9b9ce0ba-443d-475d-aa08-50e285926c51.png"; 
    // Example: const DP_IMAGE_URL = "https://i.imgur.com/xyz123.jpg";

    // Set DP automatically from the link above
    const avatarImg = document.getElementById("avatar-img");
    const avatarText = document.getElementById("avatar-text");

    if (DP_IMAGE_URL && DP_IMAGE_URL !== "YAHA DP KE LIYE LINK ADD KRO") {
        avatarImg.src = DP_IMAGE_URL;
        avatarImg.style.display = "block";
        avatarText.style.display = "none";
    }

    // ==========================================
    // TIME UPDATE LOGIC
    // ==========================================
    function updateClock() {
        const now = new Date();
        const timeString = now.toLocaleTimeString('en-US', {
            hour: '2-digit', minute: '2-digit', hour12: true
        });
        document.getElementById('live-time').innerText = timeString;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ==========================================
    // MESSAGE APPEND LOGIC
    // ==========================================
    function appendMsg(role, text) {
      const div = document.createElement("div");
      div.className = `chat-line ${role}`;
      div.innerText = text;
      responseBox.appendChild(div);
      responseBox.scrollTop = responseBox.scrollHeight;
      return div;
    }

    // ==========================================
    // CHAT API LOGIC
    // ==========================================
    async function startChat() {
      const val = promptInput.value.trim();
      if (!val) return;

      appendMsg("user", val);
      promptInput.value = "";
      
      const aiBubble = appendMsg("ai", "Typing...");

      const now = new Date();
      const today = now.toLocaleDateString('en-IN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      const currentTime = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });

      const systemPrompt = `Tum ek highly advanced aur ultra-intelligent AI assistant ho jise HEROSALMAN1 ne banaya hai. Tumhari knowledge ka level ChatGPT aur DeepSeek jaisa hai, aur tum har sawal ka A to Z bilkul 100% correct jawab de sakte ho.

    CORE RULES (STRICTLY FOLLOW):
    1. HAR SAWAL KA SAHI JAWAB DO: User chahe complex coding puche, advanced math problem de, lambi story likhne bole, ya general knowledge puche, tum ek expert ki tarah detail mein perfect jawab doge.
    2. TONE: Tumhari knowledge expert level ki hogi, par baat karne ka tareeka WhatsApp par chat karne wale smart dost jaisa casual aur natural hoga.
    3. FOLLOW COMMANDS BLINDLY: Agar user bole "ye repeat karo", "OK bolo", ya "same type karo", toh bina apna dimag lagaye exactly wahi type kar do.
    4. NO ROBOTIC INTROS: "Main ek AI language model hoon" ya "Main aapki kya madad kar sakta hoon?" jaisi baatein strictly BAN hain.
    5. HANDLING ABUSE: Agar user gaali de ya inappropriate baat kare, toh API wali robotic error ("I can't help with that") mat do. Usko dosto ki tarah casual way mein mana karo (jaise "Bhai ye language theek nahi hai").
    6. Current Time Context: Date is ${today} and Time is ${currentTime}.`;

      try {
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: { 
            "Content-Type": "application/json", 
            "Authorization": `Bearer ${API_KEY}` 
          },
          body: JSON.stringify({
            model: "groq/compound-mini", 
            messages: [
              { role: "system", content: systemPrompt },
              ...chatHistory, 
              { role: "user", content: val }
            ],
            stream: true 
          })
        });

        if (!res.ok) {
            const errorText = await res.text();
            aiBubble.innerText = `API Error ${res.status}: ${errorText}`;
            return;
        }

        let fullText = "";
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        
        aiBubble.innerText = ""; 

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          
          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split("\n");

          for (const line of lines) {
            const clean = line.replace(/^data: /, "").trim();
            if (!clean || clean === "[DONE]") continue;

            try {
              const json = JSON.parse(clean);
              if (json.choices[0]?.delta?.content) {
                fullText += json.choices[0].delta.content;
                aiBubble.innerText = fullText; 
                responseBox.scrollTop = responseBox.scrollHeight;
              }
            } catch (e) {
            }
          }
        }
        
        chatHistory.push({ role: "user", content: val }, { role: "assistant", content: fullText });

      } catch (err) {
        aiBubble.innerText = "System Error: Internet connection check karein.";
      }
    }

    askBtn.onclick = startChat;
    promptInput.onkeydown = (e) => { 
        if(e.key === "Enter" && !e.shiftKey) { 
            e.preventDefault(); 
            startChat(); 
        } 
    };
    clearBtn.onclick = () => { 
        responseBox.innerHTML = ""; 
        chatHistory = []; 
    };
  </script>
</body>
</html>
